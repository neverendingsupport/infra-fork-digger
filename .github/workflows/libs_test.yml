---
name: Libs tests

"on":
  push:
    branches: ['develop']
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup Opentofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.8.5
          
      - name: Setup terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
          terraform_version: "1.5.5"

      - name: Download Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25.4
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Deps
        run: |
          pwd
          go get -v ./...
        working-directory: libs

      - name: Install Azurite
        run: npm install -g azurite

      - name: Start Azurite service
        run: azurite --silent &

      - name: Determine if PR is from external contributor
        id: pr_check
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
          echo "is_external=false" >> $GITHUB_OUTPUT
          else
          echo "is_external=true" >> $GITHUB_OUTPUT
          fi

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.8.5

      # The license test reads DIGGER_LICENSE_KEY from Secrets Manager through
      # this repository's GitHub OIDC role. Pull requests from other forks get
      # no OIDC token, so they skip these steps and the license test fails
      # for them, as it always has.
      - name: Configure AWS credentials
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.aws_oidc_role_arn }}
          role-session-name: digger-libs-tests
          aws-region: us-west-2

      - name: Read the Digger license
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: aws-actions/aws-secretsmanager-get-secrets@2297f9a879480a9e3af9b293ed15c70caf8e1c88 # v3.0.2
        with:
          # {"license_key": ...} becomes DIGGER_LICENSE_KEY.
          secret-ids: |
            DIGGER,digger/infra-01/license
          parse-json-secrets: true

      - name: Test
        run: |
          # The license is already in DIGGER_LICENSE_KEY. Drop the AWS
          # credentials the earlier step exported, so tests that read AWS
          # settings from the environment see what they set themselves.
          unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_REGION AWS_DEFAULT_REGION
          if [ "${{ steps.pr_check.outputs.is_external }}" = "true" ]; then
            export IS_EXTERNAL_PR="true"
            go test ./... 
          else
            go test ./...
          fi
        working-directory: libs

---
name: Cli tests

"on":
  push:
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Download Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25.4
        id: go

      - name: Setup Opentofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.8.5

      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Test the shell in action.yml
        run: python3 -m unittest discover -s scripts -p 'test_action*.py'

      - name: Deps
        run: |
          go get -v ./...
        working-directory: cli

      - name: Build
        run: |
          go build -v ./cmd/digger
        working-directory: cli
        
      - name: Test
        shell: bash
        run: |
          go test ./...
        working-directory: cli

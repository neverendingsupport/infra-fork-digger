suite: test affinity
templates:
  - backend-deployment.yaml
tests:
  - it: should render no affinity by default
    asserts:
      - notExists:
          path: spec.template.spec.affinity

  - it: should pass affinity through as given
    set:
      digger.affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: digger-backend-web
              matchLabelKeys:
                - pod-template-hash
    asserts:
      - equal:
          path: spec.template.spec.affinity
          value:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app: digger-backend-web
                  matchLabelKeys:
                    - pod-template-hash

  - it: should not add a labelSelector to a term without one
    set:
      digger.affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                topologyKey: topology.kubernetes.io/zone
                namespaceSelector: {}
    asserts:
      - equal:
          path: spec.template.spec.affinity
          value:
            podAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 50
                  podAffinityTerm:
                    topologyKey: topology.kubernetes.io/zone
                    namespaceSelector: {}

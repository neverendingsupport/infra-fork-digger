suite: test replicas, probes, lifecycle and disruption budget
templates:
  - backend-deployment.yaml
  - backend-pdb.yaml
tests:
  - it: should preserve rolling updates by default
    template: backend-deployment.yaml
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - notExists:
          path: spec.strategy.rollingUpdate

  - it: should remove rolling update options for a coordinated replacement
    template: backend-deployment.yaml
    set:
      digger.updateStrategy: Recreate
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
      - equal:
          path: spec.strategy
          value:
            type: Recreate
            rollingUpdate: null

  - it: should reject an unsupported update strategy
    template: backend-deployment.yaml
    set:
      digger.updateStrategy: Parallel
    asserts:
      - failedTemplate:
          errorMessage: digger.updateStrategy must be RollingUpdate or Recreate

  - it: should keep one replica and add a readiness probe by default
    template: backend-deployment.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health
      - notExists:
          path: spec.template.spec.containers[0].lifecycle
      - notExists:
          path: spec.template.spec.terminationGracePeriodSeconds

  - it: should render no disruption budget by default
    template: backend-pdb.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should apply replicas, lifecycle and grace period when set
    template: backend-deployment.yaml
    set:
      digger.replicaCount: 2
      digger.lifecycle:
        preStop:
          sleep:
            seconds: 10
      digger.terminationGracePeriodSeconds: 45
    asserts:
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.sleep.seconds
          value: 10
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 45

  - it: should allow disabling the readiness probe
    template: backend-deployment.yaml
    set:
      digger.readinessProbe: null
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe

  - it: should select the backend pods from the disruption budget
    template: backend-pdb.yaml
    set:
      digger.podDisruptionBudget.enabled: true
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.selector.matchLabels.app
          value: digger-backend-web

  - it: should not block drains with one replica by default
    template: backend-pdb.yaml
    set:
      digger.podDisruptionBudget.enabled: true
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 1
      - notExists:
          path: spec.minAvailable

  - it: should use minAvailable in place of maxUnavailable when set
    template: backend-pdb.yaml
    set:
      digger.podDisruptionBudget.enabled: true
      digger.podDisruptionBudget.minAvailable: 50%
    asserts:
      - equal:
          path: spec.minAvailable
          value: 50%
      - notExists:
          path: spec.maxUnavailable

  - it: should render a zero grace period
    template: backend-deployment.yaml
    set:
      digger.terminationGracePeriodSeconds: 0
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 0

  - it: should keep httpGet when overriding part of the readiness probe
    template: backend-deployment.yaml
    set:
      digger.readinessProbe.periodSeconds: 5
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.periodSeconds
          value: 5
